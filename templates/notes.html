{% extends "base.html" %}
{% block content %}
<h1>Notatki</h1>
<ul>
  {% for note in notes %}<li>{{ note.title }} ({{ note.author.username }})</li>{% empty %}<li>Brak notatek</li>{% endfor %}
</ul>
{% if perms.accounts.add_note %}
<form method="post">{% csrf_token %}{{ form.as_p }}<button>Dodaj</button></form>
{% endif %}
{% endblock %}
